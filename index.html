<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIOAI v6.0</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .hub-header { text-align: center; padding: 2rem 0 1rem; }
    .hub-header h1 { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-bottom: .3rem; }
    .hub-header p { color: var(--text3); font-size: .9rem; }
    .hub-grid { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 700px; margin: 1.5rem auto; }
    .hub-card {
      display: flex; flex-direction: column; align-items: center; gap: .5rem;
      padding: 1.5rem 1.2rem; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer; transition: all .2s;
      min-width: 150px; flex: 1; max-width: 200px; text-decoration: none; color: var(--text);
    }
    .hub-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--accent-glow) 0 0 25px; }
    .hub-card img { width: 56px; height: 56px; object-fit: contain; border-radius: 8px; }
    .hub-card .platform-name { font-size: .9rem; font-weight: 600; }
    .hub-card .platform-status { font-size: .7rem; color: var(--text3); }
    .hub-card .platform-status.working { color: var(--success); }
    .hub-card .platform-status.broken { color: var(--danger); }
    .hub-card .platform-status.unstable { color: var(--warning); }
    .hub-extra { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; margin-top: .8rem; }
    .hub-extra a {
      display: flex; align-items: center; gap: .4rem; padding: .6rem 1.2rem;
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rs);
      text-decoration: none; color: var(--text2); font-size: .85rem; transition: all .15s;
    }
    .hub-extra a:hover { border-color: var(--accent); color: var(--text); }
    .notif-badge { background: var(--danger); color: #fff; font-size: .65rem; padding: .1rem .45rem; border-radius: 10px; margin-left: .3rem; }
    .hub-footer { text-align: center; font-size: .75rem; color: var(--text3); margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="app-layout" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem">
    <div style="width:100%;max-width:700px">
      <div class="hub-header">
        <h1>GIOAI</h1>
        <p>v6.0 — Multi-Platform Homework Autocompleter</p>
        <div style="margin-top:.5rem;font-size:.8rem;color:var(--text3)">
          <span id="notifCount" style="display:none" class="notif-badge">0</span>
        </div>
      </div>

      <div class="hub-grid">
        <a href="sparx.html" class="hub-card">
          <img src="sparx%20maths.png" alt="Sparx" onerror="this.outerHTML='<div style=font-size:2rem>\u2716</div>'">
          <span class="platform-name">Sparx Maths</span>
          <span class="platform-status working">Stable</span>
        </a>
        <a href="languagenut.html" class="hub-card">
          <img src="Languagenut.png" alt="LN" onerror="this.outerHTML='<div style=font-size:2rem>\ud83c\udf10</div>'">
          <span class="platform-name">LanguageNut</span>
          <span class="platform-status unstable">Unstable</span>
        </a>
        <a href="seneca.html" class="hub-card">
          <img src="seneca.png" alt="Seneca" onerror="this.outerHTML='<div style=font-size:2rem>\ud83d\udcda</div>'">
          <span class="platform-name">Seneca Learning</span>
          <span class="platform-status broken">Broken</span>
        </a>
      </div>

      <div class="hub-extra">
        <a href="notifications.html" id="notifLink">&#x1F514; Notifications</a>
        <a href="admin.html">&#x2699; Admin Panel</a>
        <a href="https://www.paypal.com/paypalme/giannineedshelp" target="_blank">&#x2665; Donate</a>
      </div>

      <div class="hub-footer">
        GIOAI v6.0 — By giannineedshelp
      </div>
    </div>
  </div>
  <script>
    try {
      var ann = JSON.parse(localStorage.getItem('gioai-announcements') || '[]');
      var seen = JSON.parse(localStorage.getItem('gioai-notif-seen') || '[]');
      var unread = ann.filter(function(a) { return seen.indexOf(a.time) === -1; });
      if (unread.length > 0) {
        var badge = document.getElementById('notifCount');
        if (badge) { badge.textContent = unread.length; badge.style.display = 'inline-block'; }
      }
    } catch(e) {}
  </script>
</body>
</html>
