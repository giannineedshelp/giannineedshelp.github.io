# ============================================================
# gitgrab.yml - Loads .env into config.js at build time
# Place this in your repo root.
# GitHub Actions or any CI will read .env and generate env-config.js
# ============================================================
version: '1.0'

tasks:
  - name: Generate env-config.js from .env
    description: Creates a JS file with all environment variables for the frontend
    input: .env
    output: env-config.js
    transform:
      type: dotenv-to-js
      prefix: WINDOW_ENV_
      template: |
        // Auto-generated from .env - DO NOT EDIT
        // Generated: {{TIMESTAMP}}
        (function() {
          window.__ENV__ = window.__ENV__ || {};
          {{#each vars}}
          window.__ENV__['{{name}}'] = '{{value}}';
          {{/each}}
        })();

  - name: Validate required vars
    description: Ensure all critical variables are present
    required:
      - ADMIN_PASSWORD
      - SPARX_LOGIN_URL
      - SENECA_LOGIN_URL
      - LANGUAGENUT_LOGIN_URL
